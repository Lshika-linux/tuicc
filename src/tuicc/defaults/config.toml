[layout]
# Which preset to use — see src/tuicc/presets/ for available numbers.
preset = 1

[navigation]

# How Tab cycles through items: "columns_first" (top to bottom, then
# next column) or "rows_first" (left to right, then next row). Leave
# at the default unless you're building a horizontal sidebar — no
# horizontal sidebar module exists yet, but the setting is here ready
# for when one does.
tab_order = "columns_first"

# Only turn this on if you actually use vim-style h/j/k/l navigation.
# Those four letters collide with "type anywhere to search apps" (the
# ambient launcher), so vim_mode users need to press "insert" first to
# start typing instead of just typing.
vim_mode = false

[navigation.keys]
# Named keys: Left, Right, Up, Down, Tab, Shift+Tab, Enter, Escape,
# Space. Or any single character, e.g. "h", "j", "k", "l".
#
# Tab/Shift+Tab (+ Down/Up as duplicates) move to the next/previous
# item, rolling into the next/previous module once you run past either
# end of the current one. Left/Right (+ Down/Up's siblings) jump
# straight to the next/previous module's first item instead of
# stepping through the rest of the current one. vim_left/vim_right/
# vim_up/vim_down below duplicate left/right/up/down again, but only
# take effect when vim_mode = true (see below) — left as plain
# characters otherwise, they'd steal 4 letters from "type anywhere to
# search apps" for everyone, not just vim users.
left = "Left"
right = "Right"
up = "Up"
down = "Down"
tab = "Tab"
previous = "Shift+Tab"
confirm = "Enter"

# Answering a Y/N confirmation dialog (e.g. before shutdown/reboot).
# The on-screen hint always reflects whatever you bind here.
confirm_yes = "y"
confirm_no = "n"

# Only live while browsing the WiFi or Bluetooth section of
# Connectivity (Enter on the "WiFi"/"Bluetooth" header enters
# browsing) — triggers a rescan/rediscover. Shown as a hint in the
# preview panel while browsing, reflecting whatever you bind here.
scan = "s"

# Also only live while browsing — WiFi only, no bluetooth equivalent.
# wifi_forget: forget the selected known network (asks Y/N first).
# wifi_connect_hidden: type in a network name that doesn't broadcast
# its SSID and connect to it. wifi_power_toggle: turn the wifi radio
# itself on/off.
wifi_forget = "d"
wifi_connect_hidden = "n"
wifi_power_toggle = "o"

# Bluetooth's own equivalents while browsing — separate keys from
# wifi_power_toggle above rather than a shared one, same reasoning
# forget/hidden already have (a real, distinct action per section).
# bt_power_toggle: turn the Bluetooth adapter itself on/off.
# bt_pairable_toggle: toggle whether the adapter accepts new pairing
# requests. Discovery uses the shared `scan` key above, not its own —
# "rescan" already means the same thing in both sections.
bt_power_toggle = "p"
bt_pairable_toggle = "a"

# Only used when vim_mode = true below (ambient typing is disabled in
# that mode specifically so h/j/k/l etc. don't collide with it) —
# press this to start typing into the launcher instead.
insert = "i"

# Also only used when vim_mode = true — see the note above the
# left/right/up/down keys.
vim_left = "h"
vim_right = "l"
vim_up = "k"
vim_down = "j"

# F1: opens the help menu (what tuicc is, a resize-mode reference, a
# keybinds reference, and a live color editor). F2: opens a persistent
# edit session — arrows/Tab/Shift+Tab pick a module, confirm
# enters resizing/moving it (arrows resize w/h or move x/y, toggled by
# move_toggle; confirm keeps the change and returns to picking another
# module; Escape reverts it); Del removes a module (asks y/n first,
# works whether or not one is being edited); Escape while picking a
# module leaves the whole session. F3: overwrites the active preset
# file in place with the current layout and leaves the session. F4:
# cycles through every preset that exists, switching to each live, and
# leaves the session. F5: saves the current layout as a brand-new
# preset (never overwrites an existing one — picks the next free
# number), switches to it as the active preset, and leaves the
# session — use this to fork a layout you like into a new slot before
# trying something different with it. F6: pick a module not currently
# on screen and spawn it (centered, ready to move) — works standalone
# or from inside the session, dropping straight into moving the new
# module.
help = "F1"
resize = "F2"
save_layout = "F3"
cycle_preset = "F4"
new_preset = "F5"
spawn_box = "F6"
move_toggle = "m"
delete_box = "Delete"

[wm]
# Which WM provider to use. Built in: "sway", "i3". See README/WIKI for
# how to add your own.
provider = "sway"

# How many workspace slots the sidebar always shows, regardless of how
# many are actually in use. "Only show real workspaces" is deliberately
# NOT a feature — it would add complexity this project doesn't want by
# default. You're of course free to change that in the code yourself.
total_workspaces = 10

# Strongly recommended, not just for rapid multi-launch edge cases.
# If your launch command gives tuicc's window a known, stable app_id
# (e.g. `kitty --app-id tuicc_scratch ...` — see README's "Summoning
# tuicc" section), set it here so tuicc can mark its own window by
# criteria instead of "whatever's focused when tuicc starts". Left ""
# (the default), a single ordinary launch can mismark a totally
# unrelated window as "tuicc itself" if something else — a
# slow-to-yield-focus app, e.g. — still holds focus for a moment when
# tuicc starts; that window then silently vanishes from every list
# tuicc shows, with no error, until the stray mark is found and
# removed by hand. Confirmed live, not just theoretical. `install.sh`
# sets this to match your launch command automatically — only leave
# it "" if you're hand-rolling your own launcher and deliberately
# accepting the risk.
# IF YOU'RE CHANGING THIS, BE SURE YOU KNOW WHAT YOU'RE DOING! 
self_app_id = ""

# When Escape dismisses tuicc from the top level (no menu/mode open),
# also return WM focus to wherever it was right before you summoned
# tuicc. Off by default: a scratchpad summon (sway/i3, see README)
# already restores prior focus itself when hidden, so this is mainly
# for WMs with no scratchpad-equivalent (e.g. niri's dedicated-
# workspace style).
return_to_origin = false

# On by default: the full tuicc experience (see README's "Summoning
# tuicc" section — install.sh sets this up for you, matching whichever
# answer you gave its own fullscreen prompt) is meant to be fullscreen
# out of the box, no i3/sway config expertise required first. Plain
# floating is a deliberate tweak you opt INTO later, not the starting
# point. With this true, tuicc re-asserts fullscreen itself right
# after a launcher spawn or session restore resolves — sway/i3 both
# drop a container back to plain floating the instant ANY new window
# is mapped anywhere in your session, even briefly on tuicc's own
# workspace before tuicc gets a chance to move it elsewhere.
# Only meaningful if your for_window rule (or the toggle scripts in
# contrib/, which read this same value) actually uses `fullscreen
# enable` in the first place — set this to false (and drop `fullscreen
# enable` from your for_window rule) if you'd rather run tuicc as a
# plain floating window.
fullscreen_only = true

[theme]
# Each value accepts: "inherit" (use the terminal's own color),
# a named color (black, red, green, yellow, blue, magenta, cyan, white),
# a hex string ("#7dd3fc"), or an [R, G, B] list (e.g. [125, 211, 252]).
# Hex and RGB are approximated to the nearest of curses's 256 colors.
#
# A named color is NOT a fixed RGB — it resolves to one of the 8
# standard ANSI palette slots (see theme.py's own NAMED_COLORS), and
# your terminal emulator decides what that slot actually renders as.
# Plenty of terminal color schemes remap those 8 slots to something
# other than their "obvious" color — e.g. "yellow" showing up as a
# shade of pink is a real, reported case, not a bug here. Use a hex
# string (or [R, G, B]) instead of a named color for any role where
# you want the exact color you set, regardless of terminal theme —
# the 256-color cube those approximate to is far less commonly
# remapped by terminal themes than the base 8/16 ANSI slots are.
background = "inherit"
border = "#808080"
border_selected = "white"
text = "white"
accent = "cyan"
selected = "blue"
warning = "yellow"
urgent = "red"

[rwb]
# RWB = "real world box" — time, date, and (see [weather] below) a
# compact weather readout, with a detailed summary in the preview
# panel when this box is selected.
time_format = "%H:%M:%S"
date_format = "%a %d.%m."

# [weather]
# Opt-in — commented out by default, same pattern as the control.toggle
# examples below. Once uncommented, exactly one of these three location
# sources must resolve, or tuicc fails loudly at startup rather than
# guessing: lat+lon (most explicit), or geoclue = true, or
# ip_approx = true — never a silent auto-detect between them. See
# CLAUDE/NOTES/design-decisions.md#weather-location-sources for why.
#
# lat = 50.0755
# lon = 14.4378
# name = "Praha"          # optional — overrides whatever the source below resolves
# code = "PRG"             # optional — a short display badge shown inline in the
#                            compact box line (e.g. "PRG ☀️ 18°C"). Purely your own
#                            preference, empty by default — not a real IATA/airport
#                            code lookup, tuicc doesn't derive or guess one.
#
# geoclue = false          # explicit opt-in: ask GeoClue2 (D-Bus, WiFi-based
#                            precise positioning — the same mechanism
#                            Windows/macOS use) for your location. Needs
#                            geoclue2 installed and configured — see
#                            CLAUDE/NOTES/known-limitations.md, this is
#                            the same GeoClue2 the Night Light example
#                            below can also need.
# ip_approx = false        # explicit opt-in: rough location via your
#                            public IP address (ip-api.com — free, no
#                            key). Can be off by a city or more,
#                            especially on mobile/VPN/corporate
#                            networks — see design-decisions.md.

[title_condense]
# Controls the extra detail line the sidebar shows under each window,
# beneath its app name — and, since it's the same shared logic, what
# the Preview module's own per-window minimap labels show too (see
# title_condense.py's own condense_title() for the real logic this
# config only supplies the app lists for). The goal is to show
# whatever the window's OWN title adds beyond its app name, not the
# raw title verbatim (which is usually redundant — most apps put their
# own name right back into the title bar).
#
# Matching is by app_id (sway) / WM_CLASS (i3), lowercased, against the
# three lists below — every app_id falls into exactly one of three
# buckets, decided in this order:
#
# 1. terminal_apps: shown in FULL, untouched. A terminal's title is
#    usually the running command or the cwd — genuinely useful, not
#    redundant — so nothing is trimmed at all.
#    Example: app_id "kitty", title "nvim ~/tuicc/main.py" -> shown
#    exactly as-is: "nvim ~/tuicc/main.py".
#
# 2. browser_apps: the title is split on " - "/" — "/" – "/" | "
#    (surrounded by whitespace), any resulting segment that matches
#    browser_title_names (case-insensitive — this is where the
#    browser's OWN name shows up, since most browsers append it to
#    every tab's title) is dropped, and the LAST remaining segment is
#    shown — usually the site name, since browser titles are
#    conventionally "Page Title - Site Name - Browser Name".
#    Example: app_id "firefox", title "Issue #42 - tuicc - GitHub -
#    Mozilla Firefox" -> split into ["Issue #42 - tuicc", "GitHub",
#    "Mozilla Firefox"], "Mozilla Firefox" dropped (matches
#    browser_title_names), last of what's left is shown: "GitHub".
#
# 3. Anything else (not in either list above): same "-"/"—"/"–"/"|"
#    split, but the FIRST segment is shown instead of the last — and
#    if that first segment, lowercased, is just the app_id again
#    (title added literally nothing beyond the app's own name), the
#    detail line is left empty rather than showing a redundant repeat.
#    Example: app_id "thunderbird", title "Inbox - Mozilla Thunderbird"
#    -> first segment "Inbox" doesn't match the app_id -> shown:
#    "Inbox". A window whose title is JUST "Mozilla Thunderbird" (no
#    " - " at all) has one segment, "mozilla thunderbird", which does
#    NOT equal the app_id "thunderbird" either in this exact case (only
#    an EXACT lowercased match against app_id is stripped, not a
#    substring/contains check) — so it would still show that segment
#    rather than going empty; this heuristic catches the common "App -
#    <detail>" shape, not every possible restatement of the app's name.
#
# Add your own apps to whichever list fits, or leave an app out of all
# three to get bucket 3's generic first-segment behavior for it.
terminal_apps = ["kitty", "alacritty", "foot", "wezterm", "st", "urxvt", "xterm", "ghostty"]
browser_apps = ["librewolf", "firefox", "chromium", "chrome", "google-chrome"]
browser_title_names = ["librewolf", "mozilla firefox", "firefox", "chromium"]

[network]
wifi_backend = "iwd"  # "iwd" or "networkmanager"
bluetooth_backend = "bluez"

[connectivity]
# How many rows the WiFi / Bluetooth sections each show at once before
# they start scrolling — one shared value for both (they live in the
# same box), same fixed-slot-plus-scroll mechanic [media]/[sysmon]
# below use for their own lists.
visible_slots = 3

[audio]
# "wpctl" (WirePlumber's own CLI) — the primary backend, since
# PipeWire/WirePlumber is what every current sway/i3 desktop actually
# runs. "pactl" is the fallback for a plain PulseAudio setup instead.
audio_backend = "wpctl"

[media]
# How many rows the Now Playing / Output lists each show at once
# before they start scrolling — same mechanic (and independently
# configurable) as [sysmon]'s own window list below.
visible_slots = 3

[sysmon]
# How many rows the window list (above the stats block below) shows at
# once before it starts scrolling — same fixed-slot-plus-scroll
# mechanic media's own Now Playing/Output lists use (see [media]
# below), each with its own independent value, not one shared global.
visible_slots = 3

# Every value the System module's own stats block shows (CPU/RAM/DISK/
# LOAD/CPUTEMP/HOT/SWAP) is configured below, one [[sysmon.block]]
# entry per metric — the single source of truth for that box: which
# blocks show at all (enabled), where each one sits (column/row — row
# is really just this block's own ORDER within its column; columns
# don't need to have the same number of blocks, so gaps/non-contiguous
# numbers are fine), and what counts as warning (theme.warning, yellow
# by default) / urgent (theme.urgent, red) for the metrics that support
# threshold coloring at all.
#
# metric must be one of: cpu, ram, disk, load, cputemp, hot, swap.
# label is optional (defaults to the metric name, uppercased).
# warning/urgent are optional — omit both to leave a block always
# plain-colored, never threshold-tinted (load/swap default to this:
# LOAD's own "concerning" point depends on core count, not implemented
# yet; SWAP has its own documented false-positive risk — a naive
# threshold would flag the kernel's normal rarely-touched-page
# housekeeping the same as real thrashing, see VISION.md). RAM/DISK are
# colored by their real usage PERCENT even though the box itself shows
# them as used/available amounts (e.g. "5.8/1.9 GiB"), not a bare
# percent. HOT's own THROTTLED flag (a CPU-thermal signal, see
# sysinfo.py) always rides along on HOT's own cell specifically,
# wherever you put it (or not at all, if you disable/remove "hot") —
# in the packaged layout below it's the one cell with no fixed-width
# neighbor to its right, so THROTTLED can never get clipped there. If
# you reposition "hot" into a row that DOES share width with another
# column, a long THROTTLED marker can get clipped, same as any other
# value would; that's a consequence of your own layout choice, not
# something tuicc tries to work around for you.
#
# Delete a block entirely, or set enabled = false, to hide it. What
# counts as "concerning" is genuinely per-machine (a beefy desktop's
# normal 60% load reads very differently than the same 60% on a thin,
# passively-cooled laptop) — that's the whole reason this lives in
# config.toml instead of being a constant in modules/sysmon.py.

[[sysmon.block]]
metric = "cpu"
column = 1
row = 1
warning = 70
urgent = 90

[[sysmon.block]]
metric = "cputemp"
column = 1
row = 2
warning = 75
urgent = 90

[[sysmon.block]]
metric = "hot"
column = 1
row = 3
warning = 75
urgent = 90

[[sysmon.block]]
metric = "ram"
column = 2
row = 1
warning = 75
urgent = 90

[[sysmon.block]]
metric = "disk"
column = 2
row = 2
warning = 80
urgent = 95

[[sysmon.block]]
metric = "load"
column = 3
row = 1

[[sysmon.block]]
metric = "swap"
column = 3
row = 2

[sessions]
# Display name for each of the 3 save/load/delete slots — purely
# cosmetic, doesn't affect which file a slot reads/writes
# (~/.config/tuicc/sessions/<N>.toml). Editable from inside tuicc too
# (NAME action on a slot) — doing it that way writes back here for you.
# An empty value falls back to "Slot <N>".
name_1 = "Slot 1"
name_2 = "Slot 2"
name_3 = "Slot 3"

[[quick_actions.action]]
# label is shown, icon is optional (leave "" for none), command runs
# on Enter, confirm=true asks y/n before running (use for destructive
# actions like shutdown).
# shell_true = true only if command needs real shell syntax (pipes,
# ;, &&, $VARS) — otherwise it runs as plain arguments, no shell
# involved. Off by default: safer, and most commands don't need it.
# exit_after = false to keep tuicc open after this action runs (or
# after its confirmation is answered) — defaults to true (dismiss),
# meant for one-off, non-destructive actions like restarting a bar.
label = "== LOCK =="
icon = ""
command = "swaylock"
confirm = false
shell_true = false

[[quick_actions.action]]
label = "== LOGOUT =="
icon = ""
command = "swaymsg exit"
confirm = true
shell_true = false

[[quick_actions.action]]
label = "== REBOOT =="
icon = ""
command = "systemctl reboot"
confirm = true
shell_true = false

[[quick_actions.action]]
label = "== SHUTDOWN =="
icon = ""
command = "systemctl poweroff"
confirm = true
shell_true = false

[[power_menu.action]]
# shell_true = true only if command needs real shell syntax (pipes,
# ;, &&, $VARS) — otherwise it runs as plain arguments, no shell
# involved. Off by default: safer, and most commands don't need it.
#
# Lock/Logout below assume sway (swaylock/swaymsg) — running on i3?
# Swap them for i3lock (or whatever locker you use) and "i3-msg exit"
# before you rely on this. install.sh does this for you automatically
# if you use it; a plain git-clone setup needs this edited by hand,
# same as [wm] provider above.
label = "Lock"
shortcut = "Ctrl+L"
icon = "\uf023"
command = "swaylock"
confirm = false
shell_true = false

[[power_menu.action]]
label = "Logout"
shortcut = "Ctrl+O"
icon = "\uf08b"
command = "swaymsg exit"
confirm = true
confirm_text = "Log out?"
shell_true = false

[[power_menu.action]]
label = "Reboot"
shortcut = "Ctrl+R"
icon = "\uf021"
command = "systemctl reboot"
confirm = true
confirm_text = "Reboot now?"
shell_true = false

[[power_menu.action]]
label = "Shutdown"
shortcut = "Ctrl+P"
icon = "\U000f0425"
command = "systemctl poweroff"
confirm = true
confirm_text = "Shut down now?"
shell_true = false

# [[control.toggle]] — arbitrary user commands as a toggle grid. Zero
# code per toggle: label + shell_true, and 2+ [[control.toggle.state]]
# blocks (name/status_command/command/color). A plain on/off switch is
# just the 2-state case; a multi-way cycle (see Performance Mode below)
# is the exact same contract with more states — Enter always advances
# to the next one, wrapping back to the first after the last.
#
# status_command's exit code (0 = "currently in this state") is checked
# in declaration order, first match wins — every state needs one
# EXCEPT the last, which may omit it: if none of the earlier states
# matched, the current state must be whichever one is left, not a
# guess. color is optional (same "inherit" / named / "#hex" / [R,G,B]
# values as [theme] above) — omit it to use the module's default dot
# color for that state.
#
# A 2-state toggle shows NO "[state]" text at all — the dot itself is
# filled for whichever state is declared FIRST, outline for the other,
# same convention Connectivity's connected/disconnected dot already
# uses. Declare your "on"/active state first (every example below
# does) so the filled dot means what you'd expect. A 3+-state cycle
# keeps the "[state]" text — a plain filled dot can't distinguish
# which of 3+ states it's in, only per-state color can (see
# Performance Mode below).
#
# All commented out below — none of these run until you uncomment one
# AND have the underlying tool installed. Several assume genuinely
# arbitrary tools (tailscale, EasyEffects, ...) that most users won't
# have; these six were picked as broadly-applicable examples, not a
# "recommended defaults" list.

# [[control.toggle]]
# label = "Airplane Mode"
# shell_true = true
#
#   [[control.toggle.state]]
#   name = "on"
#   status_command = "rfkill list | grep -q 'Soft blocked: yes'"
#   command = "rfkill block all"
#
#   [[control.toggle.state]]
#   name = "off"
#   command = "rfkill unblock all"

# [[control.toggle]]
# label = "Night Light"
# shell_true = false
#
# -O 4500 is gammastep's "one shot manual mode" — sets a fixed color
# temperature immediately with no sunset/sunrise calculation, so no
# location setup (GeoClue2 or -l LAT:LON) is needed at all. It keeps
# running afterward (pgrep/pkill still work) since Wayland's gamma
# protocol reverts to normal the moment the client that set it
# disconnects — unlike X11/RANDR, where the same command still works
# but the ramp would persist even without the process; harmless either
# way. Lower = warmer/redder, 6500 = neutral (gammastep's own default).
# `-f`, not `-x`: verified live, gammastep's own binary sets its
# internal process name (comm) to ".gammastep-wrap", not "gammastep" —
# `pgrep -x`/`pkill -x` match against comm exactly and silently never
# match at all (status stuck "off" forever, off never actually kills
# it), `-f` matches the full command line instead, which does contain
# "gammastep" regardless of what comm says.
#   [[control.toggle.state]]
#   name = "on"
#   status_command = "pgrep -f gammastep"
#   command = "gammastep -O 4500"
#
#   [[control.toggle.state]]
#   name = "off"
#   command = "pkill -f gammastep"

# [[control.toggle]]
# label = "Mic Mute"
# shell_true = true
#
#   [[control.toggle.state]]
#   name = "on"
#   status_command = "pactl get-source-mute @DEFAULT_SOURCE@ | grep -q yes"
#   command = "pactl set-source-mute @DEFAULT_SOURCE@ 1"
#
#   [[control.toggle.state]]
#   name = "off"
#   command = "pactl set-source-mute @DEFAULT_SOURCE@ 0"

# [[control.toggle]]
# label = "Idle Inhibit"
# shell_true = false
#
#   [[control.toggle.state]]
#   name = "on"
#   status_command = "pgrep -f tuicc-idle-inhibit"
#   command = "systemd-inhibit --what=idle:sleep --who=tuicc-idle-inhibit --why=user-toggle --mode=block sleep infinity"
#
#   [[control.toggle.state]]
#   name = "off"
#   command = "pkill -f tuicc-idle-inhibit"

# [[control.toggle]]
# label = "Do Not Disturb"
# shell_true = true
#
#   [[control.toggle.state]]
#   name = "on"
#   status_command = "makoctl mode | grep -q do-not-disturb"
#   command = "makoctl mode -a do-not-disturb"
#
#   [[control.toggle.state]]
#   name = "off"
#   command = "makoctl mode -r do-not-disturb"
#
# # mako is sway/wlroots-only — no i3/X11 equivalent exists. On dunst,
# # swap the three commands above for:
# #   status_command = "dunstctl is-paused | grep -q true"
# #   on command      = "dunstctl set-paused true"
# #   off command     = "dunstctl set-paused false"
# # On swaync: "swaync-client -dn" (on) / "swaync-client -df" (off) —
# # check your version's exact status flag, it's changed across releases.

# [[control.toggle]]
# label = "Performance Mode"
# shell_true = true
#
#   [[control.toggle.state]]
#   name = "power-saver"
#   status_command = "[ \"$(powerprofilesctl get)\" = power-saver ]"
#   command = "powerprofilesctl set power-saver"
#   color = "blue"
#
#   [[control.toggle.state]]
#   name = "balanced"
#   status_command = "[ \"$(powerprofilesctl get)\" = balanced ]"
#   command = "powerprofilesctl set balanced"
#   color = "white"
#
#   [[control.toggle.state]]
#   name = "performance"
#   command = "powerprofilesctl set performance"
#   color = "red"
