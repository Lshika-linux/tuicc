#   command = "pactl set-source-mute @DEFAULT_SOURCE@ 1"
#
#   [[control.toggle.state]]
#   name = "off"
#   command = "pactl set-source-mute @DEFAULT_SOURCE@ 0"

# [[control.toggle]]
