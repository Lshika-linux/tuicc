[layout]
# Which preset to use — see src/tuicc/presets/ for available numbers.
preset = 1


[navigation]
# How Tab cycles through items: "columns_first" (top to bottom, then
# next column) or "rows_first" (left to right, then next row).
# leave default.. useful only if you wanted a horizontal sidebar
# [horizontal sidebar module not built yet, but planned]
tab_order = "columns_first"
# switch to true only if plan to use vim controls. they collide w the smooth
# start writing from anywhere to launch, so Vim keybind users need to press the 
# "insert" button first to type
vim_mode = false


[wm]
# Which WM provider to use. Built in: "sway", "i3". See README for how to
# add your own.
provider = "sway"
# How many workspace slots the sidebar always shows, regardless of how
# many are actually in use.
# "Only show real workspaces" is NOT a feature, would introduce complexity that
# I do not want. You're ofc free to alter the code.

total_workspaces = 10
# Optional. If your launch command gives tuicc's window a known,
# stable app_id (e.g. `kitty --app-id tuicc_scratch ...` — see
# README's "Summoning tuicc" section), set it here so tuicc can mark
# its own window by criteria instead of "whatever's focused when
# tuicc starts", which removes a race if you ever launch several
# instances back-to-back. Leave "" (the default) for a plain
# terminal launch with no known app_id — tuicc falls back to marking
# whatever's focused at startup, same as before.
self_app_id = ""
# When Escape dismisses tuicc from the top level (no menu/mode open),
# also return WM focus to wherever it was right before you summoned
# tuicc. Off by default: a scratchpad summon (sway/i3, see README)
# already restores prior focus itself when hidden, so this is mainly
# for WMs with no scratchpad-equivalent (e.g. niri's dedicated-
# workspace style).
return_to_origin = false
# On by default: the full tuicc experience (see README's "Summoning
# tuicc" section — install.sh sets this up for you, matching whichever
# answer you gave its own fullscreen prompt) is meant to be fullscreen
# out of the box, no i3/sway config expertise required first. Plain
# floating is a deliberate tweak you opt INTO later, not the starting
# point. With this true, tuicc re-asserts fullscreen itself right
# after a launcher spawn or session restore resolves — sway/i3 both
# drop a container back to plain floating the instant ANY new window
# is mapped anywhere in your session, even briefly on tuicc's own
# workspace before tuicc gets a chance to move it elsewhere.
# Only meaningful if your for_window rule (or the toggle scripts in
# contrib/, which read this same value) actually uses `fullscreen
# enable` in the first place — set this to false (and drop `fullscreen
# enable` from your for_window rule) if you'd rather run tuicc as a
# plain floating window.
fullscreen_only = true

[theme]
# Each value accepts: "inherit" (use the terminal's own color),
# a named color (black, red, green, yellow, blue, magenta, cyan, white),
# a hex string ("#7dd3fc"), or an [R, G, B] list (e.g. [125, 211, 252]).
# Hex and RGB are approximated to the nearest of curses's 256 colors.
background = "inherit"
border = "#808080"
border_selected = "white"
text = "white"
accent = "cyan"
selected = "blue"
warning = "yellow"
urgent = "red"

[navigation.keys]
# Named keys: Left, Right, Up, Down, Tab, Shift+Tab, Enter, Escape,
# Space. Or any single character, e.g. "h", "j", "k", "l".
#
# Tab/Shift+Tab (+ Down/Up as duplicates) move to the next/previous
# item, rolling into the next/previous module once you run past either
# end of the current one. Left/Right (+ Down/Up's siblings) jump
# straight to the next/previous module's first item instead of
# stepping through the rest of the current one. vim_left/vim_right/
# vim_up/vim_down below duplicate left/right/up/down again, but only
# take effect when vim_mode = true (see below) — left as plain
# characters otherwise, they'd steal 4 letters from "type anywhere to
# search apps" for everyone, not just vim users.
left = "Left"
right = "Right"
up = "Up"
down = "Down"
tab = "Tab"
previous = "Shift+Tab"
confirm = "Enter"
# Answering a Y/N confirmation dialog (e.g. before shutdown/reboot).
# The on-screen hint always reflects whatever you bind here.
confirm_yes = "y"
confirm_no = "n"
# Only used when vim_mode = true below (ambient typing is disabled in
# that mode specifically so h/j/k/l etc. don't collide with it) —
# press this to start typing into the launcher instead.
insert = "i"
# Also only used when vim_mode = true — see the note above the
# left/right/up/down keys.
vim_left = "h"
vim_right = "l"
vim_up = "k"
vim_down = "j"
# F1: opens the help menu (what tuicc is, a resize-mode reference, a
# keybinds reference, and a live color editor). F2: opens a persistent
# edit session — arrows/Tab/Shift+Tab pick a module, confirm
# enters resizing/moving it (arrows resize w/h or move x/y, toggled by
# move_toggle; confirm keeps the change and returns to picking another
# module; Escape reverts it); Del removes a module (asks y/n first,
# works whether or not one is being edited); Escape while picking a
# module leaves the whole session. F3: overwrites the active preset
# file in place with the current layout and leaves the session. F4:
# cycles through every preset that exists, switching to each live, and
# leaves the session. F6: pick a module not currently on screen and
# spawn it (centered, ready to move) — works standalone or from inside
# the session, dropping straight into moving the new module.
help = "F1"
resize = "F2"
save_layout = "F3"
cycle_preset = "F4"
spawn_box = "F6"
move_toggle = "m"
delete_box = "Delete"


[[quick_actions.action]]
# label is shown, icon is optional (leave "" for none), command runs
# on Enter, confirm=true asks y/n before running (use for destructive
# actions like shutdown).
# shell_true = true only if command needs real shell syntax (pipes,
# ;, &&, $VARS) — otherwise it runs as plain arguments, no shell
# involved. Off by default: safer, and most commands don't need it.
# exit_after = false to keep tuicc open after this action runs (or
# after its confirmation is answered) — defaults to true (dismiss),
# meant for one-off, non-destructive actions like restarting a bar.
label = "== LOCK =="
icon = ""
command = "swaylock"
confirm = false
shell_true = false

[[quick_actions.action]]
label = "== LOGOUT =="
icon = ""
command = "swaymsg exit"
confirm = true
shell_true = false

[[quick_actions.action]]
label = "== REBOOT =="
icon = ""
command = "systemctl reboot"
confirm = true
shell_true = false

[[quick_actions.action]]
label = "== SHUTDOWN =="
icon = ""
command = "systemctl poweroff"
confirm = true
shell_true = false

[clock]
time_format = "%H:%M:%S"
date_format = "%a %d.%m."

[title_condense]
# App IDs classified as terminals: their window title is shown in full
# (it's usually the running command or cwd, which is exactly useful).
terminal_apps = ["kitty", "alacritty", "foot", "wezterm", "st", "urxvt", "xterm", "ghostty"]
# App IDs classified as browsers: only the site/page name is shown,
# not the browser's own name repeated in every title.
browser_apps = ["librewolf", "firefox", "chromium", "chrome", "google-chrome"]
browser_title_names = ["librewolf", "mozilla firefox", "firefox", "chromium"]

[network]
wifi_backend = "iwd"
bluetooth_backend = "bluez"

[sessions]
# Display name for each of the 3 save/load/delete slots — purely
# cosmetic, doesn't affect which file a slot reads/writes
# (~/.config/tuicc/sessions/<N>.toml). Editable from inside tuicc too
# (NAME action on a slot) — doing it that way writes back here for you.
# An empty value falls back to "Slot <N>".
name_1 = "Slot 1"
name_2 = "Slot 2"
name_3 = "Slot 3"

[[power_menu.action]]
# shell_true = true only if command needs real shell syntax (pipes,
# ;, &&, $VARS) \u2014 otherwise it runs as plain arguments, no shell
# involved. Off by default: safer, and most commands don't need it.
#
# Lock/Logout below assume sway (swaylock/swaymsg) \u2014 running on i3?
# Swap them for i3lock (or whatever locker you use) and "i3-msg exit"
# before you rely on this. install.sh does this for you automatically
# if you use it; a plain git-clone setup needs this edited by hand,
# same as [wm] provider below.
label = "Lock"
shortcut = "Ctrl+L"
icon = "\uf023"
command = "swaylock"
confirm = false
shell_true = false

[[power_menu.action]]
label = "Logout"
shortcut = "Ctrl+O"
icon = "\uf08b"
command = "swaymsg exit"
confirm = true
confirm_text = "Log out?"
shell_true = false

[[power_menu.action]]
label = "Reboot"
shortcut = "Ctrl+R"
icon = "\uf021"
command = "systemctl reboot"
confirm = true
confirm_text = "Reboot now?"
shell_true = false

[[power_menu.action]]
label = "Shutdown"
shortcut = "Ctrl+P"
icon = "\U000f0425"
command = "systemctl poweroff"
confirm = true
confirm_text = "Shut down now?"
shell_true = false

# [[control.toggle]] — arbitrary user commands as a toggle grid. Zero
# code per toggle: label + shell_true, and 2+ [[control.toggle.state]]
# blocks (name/status_command/command/color). A plain on/off switch is
# just the 2-state case; a multi-way cycle (see Performance Mode below)
# is the exact same contract with more states — Enter always advances
# to the next one, wrapping back to the first after the last.
#
# status_command's exit code (0 = "currently in this state") is checked
# in declaration order, first match wins — every state needs one
# EXCEPT the last, which may omit it: if none of the earlier states
# matched, the current state must be whichever one is left, not a
# guess. color is optional (same "inherit" / named / "#hex" / [R,G,B]
# values as [theme] above) — omit it to use the module's default dot
# color for that state.
#
# A 2-state toggle shows NO "[state]" text at all — the dot itself is
# filled for whichever state is declared FIRST, outline for the other,
# same convention Connectivity's connected/disconnected dot already
# uses. Declare your "on"/active state first (every example below
# does) so the filled dot means what you'd expect. A 3+-state cycle
# keeps the "[state]" text — a plain filled dot can't distinguish
# which of 3+ states it's in, only per-state color can (see
# Performance Mode below).
#
# All commented out below — none of these run until you uncomment one
# AND have the underlying tool installed. Several assume genuinely
# arbitrary tools (tailscale, EasyEffects, ...) that most users won't
# have; these six were picked as broadly-applicable examples, not a
# "recommended defaults" list.

# [[control.toggle]]
# label = "Airplane Mode"
# shell_true = true
#
#   [[control.toggle.state]]
#   name = "on"
#   status_command = "rfkill list | grep -q 'Soft blocked: yes'"
#   command = "rfkill block all"
#
#   [[control.toggle.state]]
#   name = "off"
#   command = "rfkill unblock all"

# [[control.toggle]]
# label = "Night Light"
# shell_true = false
#
# -O 4500 is gammastep's "one shot manual mode" — sets a fixed color
# temperature immediately with no sunset/sunrise calculation, so no
# location setup (GeoClue2 or -l LAT:LON) is needed at all. It keeps
# running afterward (pgrep/pkill still work) since Wayland's gamma
# protocol reverts to normal the moment the client that set it
# disconnects — unlike X11/RANDR, where the same command still works
# but the ramp would persist even without the process; harmless either
# way. Lower = warmer/redder, 6500 = neutral (gammastep's own default).
# `-f`, not `-x`: verified live, gammastep's own binary sets its
# internal process name (comm) to ".gammastep-wrap", not "gammastep" —
# `pgrep -x`/`pkill -x` match against comm exactly and silently never
# match at all (status stuck "off" forever, off never actually kills
# it), `-f` matches the full command line instead, which does contain
# "gammastep" regardless of what comm says.
#   [[control.toggle.state]]
#   name = "on"
#   status_command = "pgrep -f gammastep"
#   command = "gammastep -O 4500"
#
#   [[control.toggle.state]]
#   name = "off"
#   command = "pkill -f gammastep"

