[layout]
# Which preset to use — see src/tuicc/presets/ for available numbers.
preset = 1


[navigation]
# How Tab cycles through items: "columns_first" (top to bottom, then
# next column) or "rows_first" (left to right, then next row).
# leave default.. useful only if you wanted a horizontal sidebar
# [horizontal sidebar module not built yet, but planned]
tab_order = "columns_first"
# switch to true only if plan to use vim controls. they collide w the smooth
# start writing from anywhere to launch, so Vim keybind users need to press the 
# "insert" button first to type
vim_mode = false


[wm]
# Which WM provider to use. Built in: "sway", "i3". See README for how to
# add your own.
provider = "sway"
# How many workspace slots the sidebar always shows, regardless of how
# many are actually in use.
# "Only show real workspaces" is NOT a feature, would introduce complexity that
# I do not want. You're ofc free to alter the code.

total_workspaces = 10
# Optional. If your launch command gives tuicc's window a known,
# stable app_id (e.g. `kitty --app-id tuicc_scratch ...` — see
# README's "Summoning tuicc" section), set it here so tuicc can mark
# its own window by criteria instead of "whatever's focused when
# tuicc starts", which removes a race if you ever launch several
# instances back-to-back. Leave "" (the default) for a plain
# terminal launch with no known app_id — tuicc falls back to marking
# whatever's focused at startup, same as before.
self_app_id = ""
# When Escape dismisses tuicc from the top level (no menu/mode open),
# also return WM focus to wherever it was right before you summoned
# tuicc. Off by default: a scratchpad summon (sway/i3, see README)
# already restores prior focus itself when hidden, so this is mainly
# for WMs with no scratchpad-equivalent (e.g. niri's dedicated-
# workspace style).
return_to_origin = false

[theme]
# Each value accepts: "inherit" (use the terminal's own color),
# a named color (black, red, green, yellow, blue, magenta, cyan, white),
# a hex string ("#7dd3fc"), or an [R, G, B] list (e.g. [125, 211, 252]).
# Hex and RGB are approximated to the nearest of curses's 256 colors.
background = "inherit"
border = "#808080"
border_selected = "white"
text = "white"
accent = "cyan"
selected = "blue"
warning = "yellow"
urgent = "red"

[navigation.keys]
# Named keys: Left, Right, Up, Down, Tab, Shift+Tab, Enter, Escape,
# Space. Or any single character, e.g. "h", "j", "k", "l".
left = "Left"
right = "Right"
up = "Up"
down = "Down"
tab = "Tab"
switch_module = "Shift+Tab"
confirm = "Enter"
# Answering a Y/N confirmation dialog (e.g. before shutdown/reboot).
# The on-screen hint always reflects whatever you bind here.
confirm_yes = "y"
confirm_no = "n"
# Only used when vim_mode = true below (ambient typing is disabled in
# that mode specifically so h/j/k/l etc. don't collide with it) —
# press this to start typing into the launcher instead.
insert = "i"
# F1: opens the help menu (what tuicc is, a resize-mode reference, a
# keybinds reference, and a live color editor). F2: opens a persistent
# edit session — arrows/Tab/switch_module pick a module, confirm
# enters resizing/moving it (arrows resize w/h or move x/y, toggled by
# move_toggle; confirm keeps the change and returns to picking another
# module; Escape reverts it); Del removes a module (asks y/n first,
# works whether or not one is being edited); Escape while picking a
# module leaves the whole session. F3: overwrites the active preset
# file in place with the current layout and leaves the session. F4:
# cycles through every preset that exists, switching to each live, and
# leaves the session. F6: pick a module not currently on screen and
# spawn it (centered, ready to move) — works standalone or from inside
# the session, dropping straight into moving the new module.
help = "F1"
resize = "F2"
save_layout = "F3"
cycle_preset = "F4"
spawn_box = "F6"
move_toggle = "m"
delete_box = "Delete"


[[quick_actions.action]]
# label is shown, icon is optional (leave "" for none), command runs
# on Enter, confirm=true asks y/n before running (use for destructive
# actions like shutdown).
# shell_true = true only if command needs real shell syntax (pipes,
# ;, &&, $VARS) — otherwise it runs as plain arguments, no shell
# involved. Off by default: safer, and most commands don't need it.
# exit_after = false to keep tuicc open after this action runs (or
# after its confirmation is answered) — defaults to true (dismiss),
# meant for one-off, non-destructive actions like restarting a bar.
label = "== LOCK =="
icon = ""
command = "swaylock"
confirm = false
shell_true = false

[[quick_actions.action]]
label = "== LOGOUT =="
icon = ""
command = "swaymsg exit"
confirm = true
shell_true = false

[[quick_actions.action]]
label = "== REBOOT =="
icon = ""
command = "systemctl reboot"
confirm = true
shell_true = false

[[quick_actions.action]]
label = "== SHUTDOWN =="
icon = ""
command = "systemctl poweroff"
confirm = true
shell_true = false

[clock]
time_format = "%H:%M:%S"
date_format = "%a %d.%m."

[title_condense]
# App IDs classified as terminals: their window title is shown in full
# (it's usually the running command or cwd, which is exactly useful).
terminal_apps = ["kitty", "alacritty", "foot", "wezterm", "st", "urxvt", "xterm", "ghostty"]
# App IDs classified as browsers: only the site/page name is shown,
# not the browser's own name repeated in every title.
browser_apps = ["librewolf", "firefox", "chromium", "chrome", "google-chrome"]
browser_title_names = ["librewolf", "mozilla firefox", "firefox", "chromium"]

[network]
wifi_backend = "iwd"
bluetooth_backend = "bluez"

[[power_menu.action]]
# shell_true = true only if command needs real shell syntax (pipes,
# ;, &&, $VARS) \u2014 otherwise it runs as plain arguments, no shell
# involved. Off by default: safer, and most commands don't need it.
label = "Lock"
shortcut = "Ctrl+L"
icon = "\uf023"
command = "swaylock"
confirm = false
shell_true = false

[[power_menu.action]]
label = "Logout"
shortcut = "Ctrl+O"
icon = "\uf08b"
command = "swaymsg exit"
confirm = true
confirm_text = "Log out?"
shell_true = false

[[power_menu.action]]
label = "Reboot"
shortcut = "Ctrl+R"
icon = "\uf021"
command = "systemctl reboot"
confirm = true
confirm_text = "Reboot now?"
shell_true = false

[[power_menu.action]]
label = "Shutdown"
shortcut = "Ctrl+P"
icon = "\U000f0425"
command = "systemctl poweroff"
confirm = true
confirm_text = "Shut down now?"
shell_true = false
