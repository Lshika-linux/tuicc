# Layout preset — defines where each panel sits on screen.
#
# Every box needs a name and x/y/w/h, each a ratio (0.0-1.0) of the
# terminal's width (x, w) or height (y, h):
#
#   x, y = top-left corner position
#   w, h = size
#
# Boxes are completely independent — nothing here coordinates with
# anything else. Resizing or repositioning one box never moves or
# resizes another; what you configure is exactly what renders, always.
#
# If a box looks wrong on a terminal size very different from the one
# you set it up on, that's expected, not a bug — use tuicc's own
# interactive resize mode (F2 on the module you want to adjust, arrows
# to resize/move, F3 to save as a new preset) rather than
# hand-computing ratios here.
#
# This is tuicc's own "thesis screen" (see CLAUDE/VISION.md's R7
# section) — captured from live use, F2/F3'd into shape rather than
# hand-derived: left column stacks sessions/sidebar/control/power_menu,
# launcher fills the top strip with rwb in the corner, preview
# dominates the center, bars runs the full height on the right edge,
# and connectivity/media/sysmon share the bottom row.

