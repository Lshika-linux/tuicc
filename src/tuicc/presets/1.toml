# Layout preset — defines where each panel sits on screen.
#
# Every box needs a name, x/y (always a 0.0-1.0 ratio of the terminal's
# width/height — top-left corner position), EXACTLY ONE of w or fw for
# width, and EXACTLY ONE of h or fh for height — the two axes are
# entirely independent, a box can mix ratio on one and fixed on the
# other freely:
#
#   w/h   = ratio (0.0-1.0), scales with the terminal
#   fw/fh = fixed columns/rows — an absolute terminal-cell count, never scaled
#
# Most boxes below use fh: a module with a specific row count of real
# content (control's toggle list, connectivity/media/sysmon's tables,
# sessions/power_menu/launcher/rwb's own compact strips) needs THAT
# MANY rows to look right — fewer and content gets clipped/unusable,
# more and it's just wasted empty space, so scaling it proportionally
# with the terminal is actively wrong. bars is the fw case: its
# vertical gauges are meant to grow/shrink with the screen (stays ratio
# height), but want an exact, unchanging COLUMN count to look right
# regardless of terminal size — same reasoning as fh, just the other
# axis. sidebar/preview stay ratio on both axes — they're the genuinely
# elastic boxes, meant to grow/shrink with the screen entirely.
#
# Boxes are mostly independent, with three deliberate exceptions worked
# out live (see layout_engine.py's own module docstring for the exact
# algorithms): a fixed (fh/fw) box holds its own edge against the
# terminal rather than getting clipped; a ratio box shrinks just enough
# to stop intruding into a neighbor rather than overlapping it (down to
# 0 size — simply not drawn — if truly squeezed out); and two fixed
# boxes stacked directly against each other (like control/power_menu)
# chain so the upper one sits flush above the lower rather than both
# independently claiming the terminal's own edge. None of this changes
# what you configure — it only affects what actually renders on a
# terminal size different from the one a box was set up on.
#
# If a box looks wrong on a terminal size very different from the one
# you set it up on, that's expected, not a bug — use tuicc's own
# interactive resize mode (F2 on the module you want to adjust, arrows
# to resize/move, F3 to save as a new preset) rather than
# hand-computing ratios here.
#
# Same pixel resolution across two machines does NOT mean the same
# terminal grid (font size, DPI/output scale all affect how many
# columns/rows actually fit) — if you keep separate presets per
# machine, an optional [preset] table lets tuicc auto-pick the right
# one at startup instead of you switching manually every time (F4):
#
#   [preset]
#   min_cols = 200
#   min_rows = 50
#
# Opt-in, per preset — a preset with no [preset] table (like this one)
# never participates; nothing changes unless you add this yourself.
# Among presets that DO declare it and still fit the current grid,
# tuicc picks the one with the largest min_cols*min_rows (the most
# space this preset was actually designed to use, not just the first
# one that technically fits). If none fit, config.toml's own [layout]
# preset value is used, unchanged — never a guess, never persisted
# back to config.toml either way (F4/F5 remain the only things that
# actually change what's saved there).
#
# This is tuicc's own "thesis screen" (see CLAUDE/VISION.md's R7
# section) — captured from live use, F2/F3'd into shape rather than
# hand-derived: left column stacks sessions/sidebar/control/power_menu,
# launcher fills the top strip with rwb in the corner, preview
# dominates the center, bars runs the full height on the right edge,
# and connectivity/media/sysmon share the bottom row.
#
# Every fh value below is that box's own real row count, and bars' fw
# is its own real column count, on Rafi's own daily terminal (51 rows,
# 192 cols) — converted from this preset's own previous ratio values
# (every one of them landed on an exact integer against that size,
# confirming that's genuinely what they were already tuned against by
# hand, not a guess made converting them).

