[pytest]
# src: tuicc's own package. ".": repo root, so tests/test_main.py can
# `import main` — that only worked locally under `python -m pytest`
# (which prepends cwd to sys.path itself, a `python -m` behavior, not
# pytest's) and broke in CI's plain `pytest tests/ -v` invocation,
# found live via a red run right after test_main.py landed.
pythonpath = src .